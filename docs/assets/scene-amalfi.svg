<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="amSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="56%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="amSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="45%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
  </defs>

  <!-- Mediterranean Sky & Golden Sun -->
  <rect width="640" height="305" fill="url(#amSky)"/>
  <circle cx="496" cy="92" r="50" fill="#FEF08A" opacity="0.28"/>
  <circle cx="496" cy="92" r="32" fill="#FDE047"/>

  <!-- Soft Coastal Clouds -->
  <g fill="#FFFFFF" opacity="0.88">
    <ellipse cx="322" cy="76" rx="44" ry="15"/>
    <circle cx="304" cy="68" r="16"/>
    <circle cx="328" cy="64" r="19"/>
    <circle cx="348" cy="70" r="13"/>
  </g>

  <!-- Sparkling Mediterranean Sea -->
  <rect x="0" y="294" width="640" height="186" fill="url(#amSea)"/>
  <ellipse cx="496" cy="328" rx="54" ry="7" fill="#FEF08A" opacity="0.45"/>
  <ellipse cx="496" cy="350" rx="36" ry="5" fill="#FEF08A" opacity="0.32"/>
  <path d="M210 356 Q310 344 410 356 T610 352" stroke="#7DD3FC" stroke-width="3.5" fill="none" opacity="0.48" stroke-linecap="round"/>
  <path d="M260 404 Q370 392 480 404 T630 400" stroke="#BAE6FD" stroke-width="2.5" fill="none" opacity="0.38" stroke-linecap="round"/>
  <path d="M180 444 Q320 432 450 444 T620 440" stroke="#7DD3FC" stroke-width="3" fill="none" opacity="0.32" stroke-linecap="round"/>

  <!-- Dramatic Terraced Cliff on Left -->
  <path d="M0,104 Q150,118 242,208 Q304,264 342,334 L0,334 Z" fill="#78716C"/>
  <path d="M0,148 Q128,162 214,242 Q264,284 294,344 L0,344 Z" fill="#57534E"/>
  <!-- Lush Olive & Cypress Foliage on Cliff -->
  <g fill="#15803D">
    <circle cx="48" cy="144" r="28"/><circle cx="136" cy="186" r="24"/>
    <circle cx="222" cy="236" r="26"/><circle cx="282" cy="296" r="24"/>
    <ellipse cx="96" cy="128" rx="9" ry="28" fill="#166534"/>
    <ellipse cx="188" cy="184" rx="8" ry="26" fill="#166534"/>
  </g>

  <!-- Cascading Pastel Positano Villas -->
  <!-- Villa 1 (Terracotta) -->
  <g transform="translate(22,138)">
    <rect width="66" height="58" rx="3" fill="#FB923C" stroke="#9A3412" stroke-width="2"/>
    <polygon points="-4,4 33,-16 70,4" fill="#B45309"/>
    <rect x="12" y="14" width="12" height="18" rx="6" fill="#1E293B"/>
    <rect x="42" y="14" width="12" height="18" rx="6" fill="#1E293B"/>
    <rect x="26" y="36" width="14" height="22" rx="7" fill="#7C2D12"/>
  </g>
  <!-- Villa 2 (Lemon Cream) -->
  <g transform="translate(96,174)">
    <rect width="74" height="62" rx="3" fill="#FEF08A" stroke="#A16207" stroke-width="2"/>
    <polygon points="-4,4 37,-16 78,4" fill="#C2410C"/>
    <rect x="12" y="14" width="12" height="18" rx="6" fill="#0369A1"/>
    <rect x="32" y="14" width="12" height="18" rx="6" fill="#0369A1"/>
    <rect x="52" y="14" width="12" height="18" rx="6" fill="#0369A1"/>
  </g>
  <!-- Villa 3 (Rose Coral) -->
  <g transform="translate(178,214)">
    <rect width="68" height="62" rx="3" fill="#FDA4AF" stroke="#BE123C" stroke-width="2"/>
    <path d="M6,0 Q34,-26 62,0 Z" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
    <rect x="14" y="16" width="12" height="18" rx="6" fill="#1E293B"/>
    <rect x="42" y="16" width="12" height="18" rx="6" fill="#1E293B"/>
  </g>
  <!-- Villa 4 (Sunlit White) -->
  <g transform="translate(64,238)">
    <rect width="84" height="68" rx="3" fill="#FFFBEB" stroke="#A8A29E" stroke-width="2"/>
    <polygon points="-4,4 42,-14 88,4" fill="#DC2626"/>
    <rect x="14" y="16" width="14" height="20" rx="7" fill="#0284C7"/>
    <rect x="56" y="16" width="14" height="20" rx="7" fill="#0284C7"/>
    <rect x="34" y="42" width="16" height="26" rx="8" fill="#B45309"/>
  </g>

  <!-- Crisp White Sailboat on the Bay -->
  <g transform="translate(418,324)">
    <path d="M0,48 L112,48 L96,68 L18,68 Z" fill="#FFFFFF" stroke="#0C4A6E" stroke-width="2.2"/>
    <rect x="10" y="54" width="90" height="5" fill="#EA580C"/>
    <line x1="54" y1="48" x2="54" y2="-38" stroke="#0C4A6E" stroke-width="3"/>
    <polygon points="58,-34 108,40 58,40" fill="#FFFBEB" stroke="#CBD5E1" stroke-width="1.5"/>
    <polygon points="50,-22 10,40 50,40" fill="#FED7AA"/>
  </g>

  <!-- Foreground Amalfi Lemon Branch Framing Bottom Left -->
  <path d="M-10,480 Q90,418 196,438" stroke="#166534" stroke-width="7" fill="none" stroke-linecap="round"/>
  <g fill="#15803D">
    <ellipse cx="48" cy="434" rx="22" ry="11" transform="rotate(-28 48 434)"/>
    <ellipse cx="116" cy="422" rx="22" ry="11" transform="rotate(14 116 422)"/>
    <ellipse cx="164" cy="448" rx="20" ry="10" transform="rotate(-12 164 448)"/>
  </g>
  <g fill="#FACC15" stroke="#CA8A04" stroke-width="2">
    <ellipse cx="80" cy="450" rx="18" ry="13" transform="rotate(-18 80 450)"/>
    <ellipse cx="144" cy="434" rx="16" ry="12" transform="rotate(20 144 434)"/>
  </g>
</svg>