name: Deploy Landing Page to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

jobs:
  deploy_live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WANDERERS_LEDGER }}
          channelId: live
          projectId: wanderers-ledger
